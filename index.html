<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti To-Do</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <p class="app__eyebrow">Quick App</p>
        <h1>Confetti To-Do List</h1>
        <p class="app__subhead">Check off a task to celebrate with confetti.</p>
      </header>

      <section class="card">
        <h2>Today's Tasks</h2>
        <ul class="todo-list">
          <li>
            <label class="todo-item">
              <input type="checkbox" />
              <span>Finish the design review</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" />
              <span>Reply to client feedback</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" />
              <span>Ship the weekly update</span>
            </label>
          </li>
        </ul>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
